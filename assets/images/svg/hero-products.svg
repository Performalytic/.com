<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="prodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.16"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#60a5fa;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="280" rx="20" fill="#0f1d35"/>
  <circle cx="200" cy="140" r="120" fill="url(#prodGrad)" opacity="0.6"/>

  <g opacity="0.8">
    <path d="M318,62 l-5,10 M313,67 l10,-5 M324,72 l-1,1" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M352,112 l-5,10 M347,117 l10,-5 M358,122 l-1,1" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.25;1" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M38,140 l-5,10 M33,145 l10,-5 M44,150 l-1,1" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M344,206 l-5,10 M339,211 l10,-5 M350,216 l-1,1" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" begin="0.3s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <rect x="258" y="24" width="96" height="24" rx="12" fill="#0b1526" stroke="rgba(52,211,153,0.45)"/>
    <circle cx="272" cy="36" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="272" cy="36" r="4" fill="none" stroke="#34d399" stroke-width="1.5">
      <animate attributeName="r" values="4;11" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="282" y="40" font-size="10" fill="#a7f3d0">98% Matched</text>
  </g>

  <rect x="70" y="52" width="260" height="150" rx="12" fill="#0b1526" stroke="rgba(96,165,250,0.35)" stroke-width="1.5"/>
  <circle cx="84" cy="66" r="3" fill="#ef4444" opacity="0.55"/>
  <circle cx="95" cy="66" r="3" fill="#eab308" opacity="0.55"/>
  <circle cx="106" cy="66" r="3" fill="#22c55e" opacity="0.55"/>

  <rect x="70" width="260" height="2" fill="url(#scanGrad)">
    <animate attributeName="y" values="54;200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <g>
    <text x="112" y="88" text-anchor="end" font-size="9.5" fill="#94a3b8">Reconciliation</text>
    <rect x="118" y="82" width="120" height="6" rx="3" fill="rgba(148,163,184,0.14)"/>
    <rect x="118" y="82" height="6" rx="3" fill="url(#barGrad)">
      <animate attributeName="width" from="0" to="112" dur="1.4s" begin="0.4s" fill="freeze"/>
    </rect>
  </g>
  <g>
    <text x="112" y="106" text-anchor="end" font-size="9.5" fill="#94a3b8">Data Quality</text>
    <rect x="118" y="100" width="120" height="6" rx="3" fill="rgba(148,163,184,0.14)"/>
    <rect x="118" y="100" height="6" rx="3" fill="url(#barGrad)">
      <animate attributeName="width" from="0" to="96" dur="1.4s" begin="0.7s" fill="freeze"/>
    </rect>
  </g>
  <g>
    <text x="112" y="124" text-anchor="end" font-size="9.5" fill="#94a3b8">Observability</text>
    <rect x="118" y="118" width="120" height="6" rx="3" fill="rgba(148,163,184,0.14)"/>
    <rect x="118" y="118" height="6" rx="3" fill="url(#barGrad)">
      <animate attributeName="width" from="0" to="103" dur="1.4s" begin="1s" fill="freeze"/>
    </rect>
  </g>

  <g>
    <circle cx="288" cy="88" r="30" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.35)" stroke-width="1.5"/>
    <text x="288" y="93" text-anchor="middle" font-size="20" font-weight="700" fill="#34d399">98%</text>
    <text x="288" y="107" text-anchor="middle" font-size="9" fill="#64748b">Match Rate</text>
  </g>

  <polyline points="92,184 116,172 140,163 164,168 188,146 212,154 236,136 260,146 286,140" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="220" stroke-dashoffset="220">
    <animate attributeName="stroke-dashoffset" values="220;0" dur="2.4s" begin="0.6s" fill="freeze"/>
  </polyline>
  <circle cx="286" cy="140" r="4" fill="#a78bfa">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.9s" fill="freeze"/>
  </circle>
  <circle cx="286" cy="140" r="4" fill="none" stroke="#a78bfa" stroke-width="1.5">
    <animate attributeName="r" values="4;13" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <rect x="68" y="224" width="118" height="24" rx="12" fill="#0b1526" stroke="rgba(167,139,250,0.45)"/>
  <text x="80" y="240" font-size="10" fill="#d5c9f5">AI-Powered Platform</text>

  <rect x="236" y="224" width="112" height="24" rx="12" fill="#0b1526" stroke="rgba(56,189,248,0.45)"/>
  <circle cx="248" cy="236" r="3.5" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="258" y="240" font-size="10" fill="#bae6fd">24/7 Monitoring</text>
</svg>