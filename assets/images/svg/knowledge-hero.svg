<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="kfHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="kfLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="20" fill="#0f1d35"/>
  <circle cx="200" cy="140" r="120" fill="url(#kfHero)" opacity="0.4"/>
  
  <!-- Open book -->
  <g transform="translate(200,130)">
    <path d="M-50,-20 L-50,30 C-50,30 -25,20 0,30 L0,-20" fill="rgba(37,99,235,0.08)" stroke="#60a5fa" stroke-width="2"/>
    <path d="M50,-20 L50,30 C50,30 25,20 0,30 L0,-20" fill="rgba(124,58,237,0.08)" stroke="#a78bfa" stroke-width="2"/>
    <!-- Text lines on left page -->
    <rect x="-42" y="-10" width="30" height="3" rx="1.5" fill="#60a5fa" opacity="0.3"/>
    <rect x="-42" y="-2" width="25" height="3" rx="1.5" fill="#60a5fa" opacity="0.2"/>
    <rect x="-42" y="6" width="35" height="3" rx="1.5" fill="#60a5fa" opacity="0.2"/>
    <rect x="-42" y="14" width="20" height="3" rx="1.5" fill="#60a5fa" opacity="0.15"/>
    <!-- Text lines on right page -->
    <rect x="12" y="-10" width="28" height="3" rx="1.5" fill="#a78bfa" opacity="0.3"/>
    <rect x="12" y="-2" width="32" height="3" rx="1.5" fill="#a78bfa" opacity="0.2"/>
    <rect x="12" y="6" width="22" height="3" rx="1.5" fill="#a78bfa" opacity="0.2"/>
    <rect x="12" y="14" width="30" height="3" rx="1.5" fill="#a78bfa" opacity="0.15"/>
    <!-- Sparkle -->
    <circle cx="0" cy="-30" r="3" fill="#60a5fa" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Floating knowledge nodes -->
  <circle cx="60" cy="60" r="8" fill="rgba(37,99,235,0.15)" stroke="#60a5fa" stroke-width="1.5">
    <animate attributeName="cy" values="60;52;60" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="80" r="6" fill="rgba(124,58,237,0.15)" stroke="#a78bfa" stroke-width="1.5">
    <animate attributeName="cy" values="80;72;80" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="220" r="5" fill="rgba(96,165,250,0.15)" stroke="#60a5fa" stroke-width="1">
    <animate attributeName="cy" values="220;214;220" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="200" r="7" fill="rgba(167,139,250,0.12)" stroke="#a78bfa" stroke-width="1">
    <animate attributeName="cy" values="200;193;200" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Connection lines -->
  <line x1="68" y1="60" x2="150" y2="120" stroke="#60a5fa" stroke-width="1" opacity="0.15"/>
  <line x1="334" y1="80" x2="250" y2="120" stroke="#a78bfa" stroke-width="1" opacity="0.15"/>
</svg>