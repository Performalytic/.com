<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="aGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.06"/>
    </linearGradient>
    <linearGradient id="aGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <filter id="aShadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.12"/></filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="280" rx="16" fill="#0f1d35"/>
  <circle cx="200" cy="140" r="100" fill="url(#aGrad1)" opacity="0.4"/>
  
  <!-- Clipboard document -->
  <rect x="130" y="50" width="140" height="180" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#aShadow)"/>
  <rect x="165" y="40" width="70" height="20" rx="8" fill="#2563eb"/>
  <rect x="170" y="46" width="60" height="8" rx="4" fill="#0f1d35"/>
  
  <!-- Document lines -->
  <rect x="150" y="80" width="80" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
  <rect x="150" y="96" width="60" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="150" y="112" width="90" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="150" y="128" width="45" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
  
  <!-- Checkmarks -->
  <g stroke="#22c55e" stroke-width="2" stroke-linecap="round" fill="none">
    <polyline points="150,158 156,164 168,152" opacity="0.8">
      <animate attributeName="opacity" values="0;0.8;0.8" dur="2s" fill="freeze"/>
    </polyline>
    <polyline points="150,178 156,184 168,172" opacity="0.8">
      <animate attributeName="opacity" values="0;0;0.8;0.8" dur="2.5s" fill="freeze"/>
    </polyline>
    <polyline points="150,198 156,204 168,192" opacity="0.8">
      <animate attributeName="opacity" values="0;0;0;0.8" dur="3s" fill="freeze"/>
    </polyline>
  </g>
  
  <!-- Text labels next to checks -->
  <rect x="180" y="155" width="50" height="5" rx="2.5" fill="rgba(255,255,255,0.1)"/>
  <rect x="180" y="175" width="40" height="5" rx="2.5" fill="rgba(255,255,255,0.08)"/>
  <rect x="180" y="195" width="55" height="5" rx="2.5" fill="rgba(255,255,255,0.08)"/>
  
  <!-- Magnifying glass -->
  <g transform="translate(300, 80)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#60a5fa" stroke-width="3" opacity="0.8"/>
    <line x1="17" y1="17" x2="30" y2="30" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <circle cx="0" cy="0" r="16" fill="rgba(96,165,250,0.08)"/>
    <!-- Sparkle in lens -->
    <circle cx="-4" cy="-4" r="2" fill="#60a5fa" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Floating data nodes -->
  <circle cx="80" cy="100" r="6" fill="#2563eb" opacity="0.4">
    <animate attributeName="cy" values="100;92;100" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="200" r="4" fill="#a78bfa" opacity="0.4">
    <animate attributeName="cy" values="200;192;200" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <line x1="80" y1="106" x2="130" y2="130" stroke="#2563eb" stroke-width="1" opacity="0.2"/>
</svg>