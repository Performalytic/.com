<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="tBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a33"/>
      <stop offset="1" stop-color="#16152f"/>
    </linearGradient>
    <linearGradient id="tHub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="tNode" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12263f"/>
      <stop offset="1" stop-color="#0b1830"/>
    </linearGradient>
    <radialGradient id="tGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="tShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="280" rx="24" fill="url(#tBg)"/>
  <rect width="400" height="280" rx="24" fill="url(#tGlow)"/>

  <text x="200" y="33" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="url(#tHub)">Modern Tech Stack</text>
  <text x="200" y="51" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Cloud &#183; Data &#183; AI</text>

  <g fill="#60a5fa" opacity="0.15">
    <circle cx="38" cy="28" r="2.2"/>
    <circle cx="368" cy="120" r="2.2"/>
    <circle cx="22" cy="150" r="1.8"/>
    <circle cx="378" cy="250" r="1.8"/>
    <circle cx="330" cy="30" r="1.6"/>
    <circle cx="196" cy="246" r="1.6"/>
  </g>

  <g fill="#a78bfa">
    <path d="M46 74 l3 -7 3 7 -7 -4 7 0 z" opacity="0.8">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M340 158 l3 -7 3 7 -7 -4 7 0 z" opacity="0.8">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M302 60 l2.5 -6 2.5 6 -6 -3.5 6 0 z" opacity="0.6">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <rect x="26" y="240" width="132" height="28" rx="14" fill="#0b1526" stroke="rgba(96,165,250,0.35)" filter="url(#tShadow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="58" cy="254" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="58" cy="254" r="9" stroke="rgba(52,211,153,0.5)" stroke-width="1.5" fill="none">
      <animate attributeName="r" values="6;14;6" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="142" y="258.5" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#93c5fd">Cloud Ready</text>
  </g>

  <g>
    <rect x="258" y="238" width="116" height="28" rx="14" fill="#0b1526" stroke="rgba(56,189,248,0.35)" filter="url(#tShadow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <text x="316" y="256.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#7dd3fc">50+ Integrations</text>
  </g>

  <line x1="200" y1="140" x2="134" y2="102" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="2.4s" repeatCount="indefinite"/>
  </line>
  <line x1="200" y1="140" x2="266" y2="102" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="2.8s" repeatCount="indefinite"/>
  </line>
  <line x1="200" y1="140" x2="134" y2="198" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="200" y1="140" x2="266" y2="198" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="2.6s" repeatCount="indefinite"/>
  </line>

  <circle cx="200" cy="140" r="64" stroke="rgba(96,165,250,0.25)" stroke-width="1.5" fill="none">
    <animate attributeName="r" values="56;70;56" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.12;0.6" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="140" r="54" stroke="rgba(167,139,250,0.4)" stroke-width="1.5" stroke-dasharray="6 9" fill="none">
    <animateTransform attributeName="transform" type="rotate" from="0 200 140" to="360 200 140" dur="22s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#tShadow)">
    <circle cx="200" cy="140" r="42" fill="url(#tHub)"/>
    <rect x="184" y="123" width="7" height="16" rx="3.5" fill="rgba(255,255,255,0.85)"/>
    <rect x="196" y="112" width="7" height="27" rx="3.5" fill="#fff"/>
    <rect x="208" y="128" width="7" height="11" rx="3.5" fill="rgba(255,255,255,0.85)"/>
    <circle cx="200" cy="140" r="42" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  </g>

  <g filter="url(#tShadow)">
    <circle cx="112" cy="92" r="13" fill="rgba(96,165,250,0.25)" stroke="#60a5fa" stroke-width="1.5" fill-opacity="0">
      <animate attributeName="r" values="16;24;16" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="112" cy="92" r="21" fill="url(#tNode)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="112" y="97" text-anchor="middle" font-size="17">&#9729;</text>
  </g>

  <g filter="url(#tShadow)">
    <circle cx="288" cy="92" r="13" fill="rgba(167,139,250,0.25)" stroke="#a78bfa" stroke-width="1.5" fill-opacity="0">
      <animate attributeName="r" values="16;24;16" dur="3s" repeatCount="indefinite" begin="0.4s"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="3s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <circle cx="288" cy="92" r="21" fill="url(#tNode)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="288" y="97" text-anchor="middle" font-size="17">&#129504;</text>
  </g>

  <g filter="url(#tShadow)">
    <circle cx="112" cy="208" r="13" fill="rgba(52,211,153,0.25)" stroke="#34d399" stroke-width="1.5" fill-opacity="0">
      <animate attributeName="r" values="16;24;16" dur="2.8s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.8s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="112" cy="208" r="21" fill="url(#tNode)" stroke="#34d399" stroke-width="1.5"/>
    <text x="112" y="213" text-anchor="middle" font-size="17">&#9881;</text>
  </g>

  <g filter="url(#tShadow)">
    <circle cx="288" cy="208" r="13" fill="rgba(56,189,248,0.25)" stroke="#38bdf8" stroke-width="1.5" fill-opacity="0">
      <animate attributeName="r" values="16;24;16" dur="3.2s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="3.2s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="288" cy="208" r="21" fill="url(#tNode)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="288" y="213" text-anchor="middle" font-size="17">&#128202;</text>
  </g>
</svg>