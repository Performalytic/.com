<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.06"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="20" fill="#0f1d35"/>
  <circle cx="200" cy="140" r="110" fill="url(#techGrad)" opacity="0.5"/>
  <!-- Code brackets -->
  <text x="120" y="150" fill="#60a5fa" font-size="60" font-weight="300" opacity="0.5">&lt;</text>
  <text x="260" y="150" fill="#60a5fa" font-size="60" font-weight="300" opacity="0.5">/&gt;</text>
  <!-- Central hub -->
  <circle cx="200" cy="130" r="30" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
  <circle cx="200" cy="130" r="12" fill="rgba(167,139,250,0.2)" stroke="#a78bfa" stroke-width="1.5"/>
  <!-- Orbiting nodes -->
  <circle cx="140" cy="90" r="10" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.6"/>
  <circle cx="260" cy="90" r="10" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.6"/>
  <circle cx="140" cy="180" r="10" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.6"/>
  <circle cx="260" cy="180" r="10" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.6"/>
  <!-- Orbital lines -->
  <ellipse cx="200" cy="130" rx="70" ry="50" fill="none" stroke="#60a5fa" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.2"/>
  <!-- Connection lines -->
  <line x1="172" y1="120" x2="150" y2="95" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
  <line x1="228" y1="120" x2="250" y2="95" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
  <line x1="172" y1="140" x2="150" y2="175" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
  <line x1="228" y1="140" x2="250" y2="175" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
</svg>