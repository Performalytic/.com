<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="faqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.06"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="20" fill="#0f1d35"/>
  <circle cx="200" cy="140" r="110" fill="url(#faqGrad)" opacity="0.5"/>
  <!-- Question mark -->
  <circle cx="200" cy="110" r="50" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="200" y="125" text-anchor="middle" fill="#60a5fa" font-size="56" font-weight="800">?</text>
  <!-- Speech bubbles -->
  <rect x="80" y="170" width="80" height="40" rx="10" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>
  <circle cx="100" cy="220" r="4" fill="#a78bfa" opacity="0.3"/>
  <rect x="240" y="170" width="80" height="40" rx="10" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.5"/>
  <circle cx="260" cy="220" r="4" fill="#60a5fa" opacity="0.3"/>
  <!-- Sparkles -->
  <circle cx="130" cy="80" r="3" fill="#a78bfa" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="270" cy="80" r="3" fill="#60a5fa" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>