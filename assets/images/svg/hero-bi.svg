<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="biGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.06"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="20" fill="#0f1d35"/>
  <circle cx="200" cy="140" r="110" fill="url(#biGrad)" opacity="0.5"/>
  <!-- Dashboard screen -->
  <rect x="120" y="75" width="160" height="130" rx="8" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.3"/>
  <rect x="130" y="85" width="60" height="40" rx="4" fill="rgba(96,165,250,0.1)" stroke="#60a5fa" stroke-width="1.5" opacity="0.5"/>
  <rect x="200" y="85" width="70" height="18" rx="3" fill="rgba(167,139,250,0.1)" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>
  <rect x="200" y="108" width="70" height="18" rx="3" fill="rgba(167,139,250,0.1)" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>
  <!-- Bar chart -->
  <rect x="140" y="145" width="14" height="40" rx="2" fill="rgba(96,165,250,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="160" y="155" width="14" height="30" rx="2" fill="rgba(96,165,250,0.2)" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="180" y="135" width="14" height="50" rx="2" fill="rgba(167,139,250,0.3)" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="200" y="160" width="14" height="25" rx="2" fill="rgba(96,165,250,0.2)" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="220" y="150" width="14" height="35" rx="2" fill="rgba(167,139,250,0.2)" stroke="#a78bfa" stroke-width="1.5"/>
  <!-- Baseline -->
  <line x1="130" y1="188" x2="240" y2="188" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <!-- Trend line -->
  <polyline points="140,180 170,162 200,168 230,150" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4"/>
  <!-- Connector dots -->
  <circle cx="140" cy="180" r="2" fill="#60a5fa" opacity="0.5"/>
  <circle cx="170" cy="162" r="2" fill="#60a5fa" opacity="0.5"/>
  <circle cx="200" cy="168" r="2" fill="#a78bfa" opacity="0.5"/>
  <circle cx="230" cy="150" r="2" fill="#60a5fa" opacity="0.5"/>
  <!-- Sparkle -->
  <circle cx="250" cy="65" r="3" fill="#60a5fa" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="220" r="2" fill="#a78bfa" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="310" cy="220" r="2" fill="#60a5fa" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.8s" repeatCount="indefinite"/>
  </circle>
</svg>
