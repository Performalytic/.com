<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="12" fill="rgba(37,99,235,0.1)"/>
  <g transform="translate(24,24)">
    <!-- Pipeline arrows -->
    <circle cx="-12" cy="0" r="3" fill="none" stroke="#2563eb" stroke-width="2"/>
    <line x1="-9" y1="0" x2="-4" y2="0" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="none" stroke="#2563eb" stroke-width="2"/>
    <line x1="3" y1="0" x2="8" y2="0" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="12" cy="0" r="3" fill="none" stroke="#2563eb" stroke-width="2"/>
    <!-- Flow animation -->
    <circle cx="-6" cy="0" r="1" fill="#60a5fa" opacity="0.6">
      <animate attributeName="cx" values="-9;8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Checkmark -->
    <polyline points="-2,8 1,11 6,6" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>