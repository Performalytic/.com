    <linearGradient id="cardMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16264a"/>
      <stop offset="1" stop-color="#0f1c38"/>
    </linearGradient>
    <filter id="cShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="cSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="280" rx="24" fill="url(#cBg)"/>
