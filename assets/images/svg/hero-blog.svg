<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="blogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.06"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="20" fill="#0f1d35"/>
  <circle cx="200" cy="140" r="110" fill="url(#blogGrad)" opacity="0.5"/>
  <!-- Article card -->
  <rect x="110" y="60" width="180" height="160" rx="12" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <!-- Image placeholder -->
  <rect x="120" y="70" width="160" height="60" rx="6" fill="rgba(96,165,250,0.08)"/>
  <line x1="130" y1="85" x2="220" y2="85" stroke="#60a5fa" stroke-width="1" opacity="0.2"/>
  <line x1="130" y1="97" x2="190" y2="97" stroke="#60a5fa" stroke-width="1" opacity="0.15"/>
  <line x1="130" y1="109" x2="200" y2="109" stroke="#60a5fa" stroke-width="1" opacity="0.15"/>
  <!-- Text lines -->
  <line x1="120" y1="145" x2="260" y2="145" stroke="#60a5fa" stroke-width="1.5" opacity="0.3"/>
  <line x1="120" y1="160" x2="240" y2="160" stroke="#60a5fa" stroke-width="1" opacity="0.2"/>
  <line x1="120" y1="172" x2="250" y2="172" stroke="#60a5fa" stroke-width="1" opacity="0.2"/>
  <line x1="120" y1="184" x2="220" y2="184" stroke="#60a5fa" stroke-width="1" opacity="0.15"/>
  <!-- Tags -->
  <rect x="120" y="198" width="40" height="12" rx="6" fill="rgba(96,165,250,0.15)"/>
  <rect x="168" y="198" width="50" height="12" rx="6" fill="rgba(124,58,237,0.12)"/>
  <!-- Floating elements -->
  <circle cx="80" cy="100" r="4" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.3">
    <animate attributeName="cy" values="100;93;100" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="180" r="3" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.3">
    <animate attributeName="cy" values="180;174;180" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>