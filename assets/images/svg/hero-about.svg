<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="abGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="abArc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="400" height="280" rx="20" fill="#0f1d35"/>
  <circle cx="200" cy="140" r="124" fill="url(#abGrad)"/>

  <!-- Flowing data spokes from hub -->
  <g stroke="rgba(96,165,250,0.35)" stroke-width="1" stroke-dasharray="4 6">
    <line x1="200" y1="140" x2="200" y2="42">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="200" y1="140" x2="312" y2="208">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.9s" repeatCount="indefinite"/>
    </line>
    <line x1="200" y1="140" x2="92" y2="208">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.7s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Outer orbit ring -->
  <circle cx="200" cy="140" r="95" stroke="rgba(96,165,250,0.12)" stroke-width="1" stroke-dasharray="2 7"/>
  <circle cx="200" cy="140" r="95" fill="none" stroke="url(#abArc)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="70 527">
    <animateTransform attributeName="transform" type="rotate" from="0 200 140" to="360 200 140" dur="20s" repeatCount="indefinite"/>
  </circle>

  <!-- Inner orbit ring -->
  <circle cx="200" cy="140" r="68" stroke="rgba(167,139,250,0.12)" stroke-width="1" stroke-dasharray="2 7"/>
  <circle cx="200" cy="140" r="68" fill="none" stroke="url(#abArc)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="60 367">
    <animateTransform attributeName="transform" type="rotate" from="360 200 140" to="0 200 140" dur="15s" repeatCount="indefinite"/>
  </circle>

  <!-- Orbiting team node on outer ring -->
  <g>
    <animateMotion dur="20s" repeatCount="indefinite" path="M295,140 a95,95 0 1,1 -190,0 a95,95 0 1,1 190,0"/>
    <circle r="17" fill="#121f3d" stroke="#60a5fa" stroke-width="1.6"/>
    <circle cy="-6" r="5" fill="#60a5fa"/>
    <path d="M-9,8 a9,9 0 0,1 18,0" stroke="#60a5fa" stroke-width="1.4" fill="none"/>
  </g>

  <!-- Orbiting team node on inner ring -->
  <g>
    <animateMotion dur="15s" repeatCount="indefinite" begin="0s" path="M268,140 a68,68 0 1,1 -136,0 a68,68 0 1,1 136,0"/>
    <circle r="15" fill="#141f3f" stroke="#a78bfa" stroke-width="1.6"/>
    <circle cy="-5" r="4.5" fill="#a78bfa"/>
    <path d="M-8,7 a8,8 0 0,1 16,0" stroke="#a78bfa" stroke-width="1.3" fill="none"/>
  </g>

  <!-- Third orbiting team node on inner ring (offset) -->
  <g>
    <animateMotion dur="15s" repeatCount="indefinite" begin="-5s" path="M268,140 a68,68 0 1,1 -136,0 a68,68 0 1,1 136,0"/>
    <circle r="13" fill="#121f3d" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cy="-4" r="4" fill="#60a5fa" opacity="0.85"/>
    <path d="M-7,6 a7,7 0 0,1 14,0" stroke="#60a5fa" stroke-width="1.2" fill="none" opacity="0.85"/>
  </g>

  <!-- Central hub with pulsing core + ripples -->
  <circle cx="200" cy="140" r="32" fill="rgba(37,99,235,0.10)" stroke="#60a5fa" stroke-width="1.2">
    <animate attributeName="r" values="32;37;32" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="140" r="11" fill="url(#abArc)">
    <animate attributeName="r" values="9.5;13;9.5" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="140" r="14" fill="none" stroke="rgba(96,165,250,0.45)" stroke-width="1.5">
    <animate attributeName="r" values="14;34;34" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="140" r="14" fill="none" stroke="rgba(96,165,250,0.4)" stroke-width="1.5">
    <animate attributeName="r" values="14;34;34" dur="2.6s" repeatCount="indefinite" begin="1.3s"/>
    <animate attributeName="opacity" values="0.5;0;0" dur="2.6s" repeatCount="indefinite" begin="1.3s"/>
  </circle>

  <!-- Sparkles -->
  <circle cx="205" cy="58" r="3" fill="#60a5fa" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="208" r="2.5" fill="#a78bfa" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="306" cy="212" r="2.5" fill="#60a5fa" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="330" cy="80" r="2" fill="#a78bfa" opacity="0.5">
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="78" cy="96" r="2" fill="#60a5fa" opacity="0.4">
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="2.6s" repeatCount="indefinite" begin="0.8s"/>
  </circle>
</svg>