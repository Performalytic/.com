<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="contactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.06"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="20" fill="#0f1d35"/>
  <circle cx="200" cy="140" r="110" fill="url(#contactGrad)" opacity="0.5"/>
  <!-- Envelope -->
  <rect x="130" y="90" width="140" height="100" rx="12" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
  <polyline points="130,90 200,145 270,90" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
  <line x1="130" y1="190" x2="175" y2="145" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <line x1="270" y1="190" x2="225" y2="145" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <!-- Notification dots -->
  <circle cx="260" cy="85" r="14" fill="#7c3aed" opacity="0.8"/>
  <text x="260" y="90" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">3</text>
  <!-- Floating elements -->
  <circle cx="80" cy="100" r="6" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.4">
    <animate attributeName="cy" values="100;92;100" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="180" r="5" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.4">
    <animate attributeName="cy" values="180;173;180" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <rect x="70" y="170" width="10" height="10" rx="2" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.3" transform="rotate(30 75 175)">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>