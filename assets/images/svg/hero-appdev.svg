<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="appdevGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.06"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="20" fill="#0f1d35"/>
  <circle cx="200" cy="140" r="110" fill="url(#appdevGrad)" opacity="0.5"/>
  <!-- Code editor window -->
  <rect x="115" y="70" width="170" height="140" rx="8" fill="rgba(96,165,250,0.05)" stroke="#60a5fa" stroke-width="1.5" opacity="0.3"/>
  <!-- Window dots -->
  <circle cx="130" cy="84" r="4" fill="rgba(96,165,250,0.3)"/>
  <circle cx="146" cy="84" r="4" fill="rgba(167,139,250,0.3)"/>
  <circle cx="162" cy="84" r="4" fill="rgba(96,165,250,0.2)"/>
  <!-- Code lines -->
  <rect x="130" y="102" width="60" height="4" rx="2" fill="rgba(96,165,250,0.3)"/>
  <rect x="130" y="116" width="90" height="4" rx="2" fill="rgba(167,139,250,0.25)"/>
  <rect x="146" y="130" width="80" height="4" rx="2" fill="rgba(96,165,250,0.3)"/>
  <rect x="146" y="144" width="55" height="4" rx="2" fill="rgba(96,165,250,0.2)"/>
  <rect x="130" y="158" width="100" height="4" rx="2" fill="rgba(167,139,250,0.25)"/>
  <rect x="130" y="172" width="70" height="4" rx="2" fill="rgba(96,165,250,0.3)"/>
  <rect x="146" y="186" width="45" height="4" rx="2" fill="rgba(96,165,250,0.2)"/>
  <!-- Brackets / angle braces decoration -->
  <path d="M300,110 L310,120 L300,130" stroke="#60a5fa" stroke-width="1.5" opacity="0.25" fill="none"/>
  <path d="M310,150 L300,160 L310,170" stroke="#a78bfa" stroke-width="1.5" opacity="0.25" fill="none"/>
  <!-- Sparkle -->
  <circle cx="200" cy="45" r="3" fill="#60a5fa" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="230" r="2" fill="#a78bfa" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="310" cy="230" r="2" fill="#60a5fa" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.8s" repeatCount="indefinite"/>
  </circle>
</svg>
