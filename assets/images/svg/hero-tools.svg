<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none" font-family="Inter, Arial, sans-serif">
  <defs>
    <radialGradient id="toolGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.06"/>
    </radialGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#60a5fa;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="280" rx="20" fill="#0f1d35"/>
  <circle cx="200" cy="140" r="120" fill="url(#toolGrad)" opacity="0.7"/>

  <g opacity="0.8">
    <path d="M40,74 l-5,10 M35,79 l10,-5 M46,84 l-1,1" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M330,100 l-5,10 M325,105 l10,-5 M336,110 l-1,1" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.25;1" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M352,190 l-5,10 M347,195 l10,-5 M358,200 l-1,1" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.7s" begin="0.9s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <rect x="238" y="24" width="114" height="24" rx="12" fill="#0b1526" stroke="rgba(52,211,153,0.45)"/>
    <circle cx="252" cy="36" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="252" cy="36" r="4" fill="none" stroke="#34d399" stroke-width="1.5">
      <animate attributeName="r" values="4;11" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="262" y="40" font-size="9.5" fill="#a7f3d0">Free &#124; No Signup</text>
  </g>

  <rect x="84" y="52" width="232" height="150" rx="14" fill="#0b1526" stroke="rgba(96,165,250,0.35)" stroke-width="1.5"/>
  <circle cx="96" cy="68" r="3" fill="#ef4444" opacity="0.55"/>
  <circle cx="107" cy="68" r="3" fill="#eab308" opacity="0.55"/>
  <circle cx="118" cy="68" r="3" fill="#22c55e" opacity="0.55"/>
  <text x="148" y="72" font-size="10.5" fill="#e2e8f0">ROI Calculator</text>
  <rect x="268" y="59" width="36" height="18" rx="9" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.5)" stroke-width="1"/>
  <text x="286" y="71.5" text-anchor="middle" font-size="8.5" font-weight="600" fill="#4ade80">Free</text>

  <rect x="86" y="54" width="2" height="146" fill="url(#scanGrad)">
    <animate attributeName="x" values="84;316" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <line x1="100" y1="86" x2="300" y2="86" stroke="rgba(148,163,184,0.18)" stroke-width="1"/>

  <text x="120" y="108" font-size="9.5" fill="#94a3b8">Projected Annual Savings</text>
  <text x="120" y="142" font-size="31" font-weight="800" fill="url(#barGrad)">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.35s" fill="freeze"/>$1.9M
  </text>
  <rect x="120" y="150" width="0" height="3" rx="1.5" fill="#34d399">
    <animate attributeName="width" from="0" to="128" dur="1.6s" begin="0.55s" fill="freeze"/>
  </rect>

  <g>
    <text x="120" y="174" font-size="9" fill="#94a3b8">Payback Period</text>
    <rect x="120" y="178" width="200" height="6" rx="3" fill="rgba(148,163,184,0.14)"/>
    <rect x="120" y="178" width="0" height="6" rx="3" fill="url(#barGrad)">
      <animate attributeName="width" from="0" to="152" dur="1.4s" begin="0.9s" fill="freeze"/>
    </rect>
  </g>
  <g>
    <text x="120" y="196" font-size="9" fill="#94a3b8">Time Saved / Year</text>
    <rect x="120" y="200" width="176" height="6" rx="3" fill="rgba(148,163,184,0.14)"/>
    <rect x="120" y="200" width="0" height="6" rx="3" fill="url(#barGrad)">
      <animate attributeName="width" from="0" to="126" dur="1.4s" begin="1.2s" fill="freeze"/>
    </rect>
  </g>

  <g>
    <rect x="66" y="226" width="100" height="24" rx="12" fill="#0b1526" stroke="rgba(56,189,248,0.45)"/>
    <circle cx="78" cy="238" r="3.5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="90" y="241.5" font-size="9.5" fill="#bae6fd">Score 92/100</text>
  </g>
  <g>
    <rect x="244" y="226" width="96" height="24" rx="12" fill="#0b1526" stroke="rgba(167,139,250,0.45)"/>
    <circle cx="256" cy="238" r="3.5" fill="#a78bfa">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text x="268" y="241.5" font-size="9.5" fill="#d5c9f5">Save 320 hrs</text>
  </g>
</svg>