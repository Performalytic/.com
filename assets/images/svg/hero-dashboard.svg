<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563eb" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#060d1a" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background glow -->
  <circle cx="300" cy="240" r="200" fill="url(#grad1)" opacity="0.5">
    <animate attributeName="r" values="200;220;200" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Main dashboard card -->
  <rect x="80" y="60" width="440" height="360" rx="20" fill="#0f1d35" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#shadow2)"/>
  
  <!-- Dashboard header -->
  <rect x="80" y="60" width="440" height="56" rx="20" fill="#0a1628"/>
  <rect x="80" y="96" width="440" height="20" fill="#0a1628"/>
  <circle cx="110" cy="88" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="130" cy="88" r="6" fill="#eab308" opacity="0.8"/>
  <circle cx="150" cy="88" r="6" fill="#22c55e" opacity="0.8"/>
  <text x="300" y="92" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="12" font-weight="600">Analytics Dashboard</text>
  
  <!-- Chart area background -->
  <rect x="100" y="130" width="260" height="180" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- Animated bar chart -->
  <g filter="url(#glow)">
    <rect x="120" y="240" width="28" height="50" rx="4" fill="url(#grad2)" opacity="0.7">
      <animate attributeName="height" values="50;65;50" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="240;225;240" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="160" y="220" width="28" height="70" rx="4" fill="url(#grad2)" opacity="0.8">
      <animate attributeName="height" values="70;55;70" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="220;235;220" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="200" y="200" width="28" height="90" rx="4" fill="url(#grad2)" opacity="0.9">
      <animate attributeName="height" values="90;75;90" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="200;215;200" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="240" y="180" width="28" height="110" rx="4" fill="url(#grad2)">
      <animate attributeName="height" values="110;95;110" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="180;195;180" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="280" y="195" width="28" height="95" rx="4" fill="url(#grad2)" opacity="0.85">
      <animate attributeName="height" values="95;110;95" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="195;180;195" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="320" y="210" width="28" height="80" rx="4" fill="url(#grad2)" opacity="0.75">
      <animate attributeName="height" values="80;95;80" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="210;195;210" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Line chart overlay -->
  <polyline points="120,235 160,215 200,205 240,185 280,190 320,200 348,195" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#glow)">
    <animate attributeName="points" values="120,240 160,225 200,210 240,190 280,195 320,205 348,200;120,235 160,215 200,205 240,185 280,190 320,200 348,195;120,240 160,225 200,210 240,190 280,195 320,205 348,200" dur="4s" repeatCount="indefinite"/>
  </polyline>
  
  <!-- Glowing dot on line -->
  <circle cx="240" cy="185" r="5" fill="#60a5fa" filter="url(#glow)">
    <animate attributeName="cy" values="185;190;185" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Right side metric cards -->
  <rect x="380" y="130" width="120" height="80" rx="12" fill="rgba(37,99,235,0.1)" stroke="rgba(37,99,235,0.2)" stroke-width="1"/>
  <text x="440" y="158" text-anchor="middle" fill="#60a5fa" font-family="Inter,sans-serif" font-size="22" font-weight="800">+24%</text>
  <text x="440" y="178" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" font-weight="500">REVENUE GROWTH</text>
  
  <rect x="380" y="222" width="120" height="80" rx="12" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="440" y="250" text-anchor="middle" fill="#a78bfa" font-family="Inter,sans-serif" font-size="22" font-weight="800">98.7%</text>
  <text x="440" y="270" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" font-weight="500">DATA QUALITY</text>
  
  <!-- Bottom stats row -->
  <rect x="100" y="330" width="100" height="60" rx="10" fill="rgba(37,99,235,0.08)"/>
  <text x="150" y="355" text-anchor="middle" fill="#60a5fa" font-family="Inter,sans-serif" font-size="16" font-weight="700">2.4M</text>
  <text x="150" y="372" text-anchor="middle" fill="#64748b" font-family="Inter,sans-serif" font-size="9" font-weight="500">ROWS PROCESSED</text>
  
  <rect x="215" y="330" width="100" height="60" rx="10" fill="rgba(124,58,237,0.08)"/>
  <text x="265" y="355" text-anchor="middle" fill="#a78bfa" font-family="Inter,sans-serif" font-size="16" font-weight="700">156</text>
  <text x="265" y="372" text-anchor="middle" fill="#64748b" font-family="Inter,sans-serif" font-size="9" font-weight="500">PIPELINES ACTIVE</text>
  
  <rect x="330" y="330" width="100" height="60" rx="10" fill="rgba(34,197,94,0.08)"/>
  <text x="380" y="355" text-anchor="middle" fill="#4ade80" font-family="Inter,sans-serif" font-size="16" font-weight="700">99.9%</text>
  <text x="380" y="372" text-anchor="middle" fill="#64748b" font-family="Inter,sans-serif" font-size="9" font-weight="500">UPTIME SLA</text>
  
  <!-- Floating elements -->
  <g opacity="0.6">
    <circle cx="50" cy="150" r="4" fill="#60a5fa">
      <animate attributeName="cy" values="150;140;150" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="350" r="3" fill="#a78bfa">
      <animate attributeName="cy" values="350;340;350" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="100" r="5" fill="#60a5fa" opacity="0.4">
      <animate attributeName="cy" values="100;90;100" dur="5s" repeatCount="indefinite"/>
    </circle>
    <rect x="40" y="280" width="8" height="8" rx="2" fill="#a78bfa" opacity="0.3" transform="rotate(45 44 284)">
      <animate attributeName="y" values="280;270;280" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="550" y="200" width="6" height="6" rx="1.5" fill="#60a5fa" opacity="0.3" transform="rotate(30 553 203)">
      <animate attributeName="y" values="200;190;200" dur="3.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>