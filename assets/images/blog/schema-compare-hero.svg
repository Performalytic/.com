<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema comparison dashboard showing database differences between environments">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" rx="0" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Decorative glow orbs -->
  <circle cx="200" cy="100" r="150" fill="#2563eb" opacity="0.06"/>
  <circle cx="1000" cy="500" r="200" fill="#7c3aed" opacity="0.05"/>

  <!-- LEFT PANEL — Source Schema (Production) -->
  <rect x="40" y="30" width="540" height="570" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Panel header -->
  <rect x="40" y="30" width="540" height="52" rx="16" fill="rgba(255,255,255,0.04)"/>
  <circle cx="72" cy="56" r="8" fill="#22c55e"/>
  <text x="92" y="60" fill="#94a3b8" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">PRODUCTION</text>
  <text x="460" y="60" fill="#64748b" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">4 tables</text>

  <!-- Table: users -->
  <rect x="60" y="100" width="500" height="88" rx="10" fill="rgba(37,99,235,0.06)" stroke="rgba(37,99,235,0.15)" stroke-width="1"/>
  <text x="80" y="124" fill="#e2e8f0" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700">users</text>
  <rect x="130" y="112" width="60" height="18" rx="9" fill="rgba(37,99,235,0.15)"/>
  <text x="148" y="125" fill="#60a5fa" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="600">TABLE</text>
  <text x="460" y="124" fill="#94a3b8" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">12 columns</text>
  <!-- Column dots -->
  <g fill="#475569" font-family="monospace" font-size="10">
    <text x="80" y="150">id</text><text x="130" y="150">email</text><text x="190" y="150">name</text>
    <text x="260" y="150">role</text><text x="320" y="150">status</text><text x="390" y="150">created_at</text>
  </g>
  <text x="80" y="172" fill="#475569" font-family="monospace" font-size="10">+ 6 more columns</text>

  <!-- Table: orders -->
  <rect x="60" y="200" width="500" height="88" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="80" y="224" fill="#e2e8f0" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700">orders</text>
  <rect x="145" y="212" width="60" height="18" rx="9" fill="rgba(37,99,235,0.15)"/>
  <text x="163" y="225" fill="#60a5fa" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="600">TABLE</text>
  <text x="460" y="224" fill="#94a3b8" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">8 columns</text>
  <g fill="#475569" font-family="monospace" font-size="10">
    <text x="80" y="250">id</text><text x="120" y="250">user_id</text><text x="200" y="250">total</text>
    <text x="260" y="250">status</text><text x="330" y="250">created_at</text>
  </g>
  <text x="80" y="272" fill="#475569" font-family="monospace" font-size="10">+ 3 more columns</text>

  <!-- Table: products -->
  <rect x="60" y="300" width="500" height="88" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="80" y="324" fill="#e2e8f0" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700">products</text>
  <rect x="160" y="312" width="60" height="18" rx="9" fill="rgba(37,99,235,0.15)"/>
  <text x="178" y="325" fill="#60a5fa" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="600">TABLE</text>
  <text x="460" y="324" fill="#94a3b8" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">15 columns</text>
  <g fill="#475569" font-family="monospace" font-size="10">
    <text x="80" y="350">id</text><text x="120" y="350">sku</text><text x="170" y="350">name</text>
    <text x="230" y="350">price</text><text x="290" y="350">category</text>
  </g>
  <text x="80" y="372" fill="#475569" font-family="monospace" font-size="10">+ 10 more columns</text>

  <!-- Table: inventory -->
  <rect x="60" y="400" width="500" height="88" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="80" y="424" fill="#e2e8f0" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700">inventory</text>
  <rect x="175" y="412" width="60" height="18" rx="9" fill="rgba(37,99,235,0.15)"/>
  <text x="193" y="425" fill="#60a5fa" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="600">TABLE</text>
  <text x="460" y="424" fill="#94a3b8" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">6 columns</text>
  <g fill="#475569" font-family="monospace" font-size="10">
    <text x="80" y="450">id</text><text x="120" y="450">product_id</text><text x="220" y="450">qty</text>
    <text x="270" y="450">location</text>
  </g>
  <text x="80" y="472" fill="#475569" font-family="monospace" font-size="10">+ 2 more columns</text>

  <!-- RIGHT PANEL — Target Schema (Staging) -->
  <rect x="620" y="30" width="540" height="570" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Panel header -->
  <rect x="620" y="30" width="540" height="52" rx="16" fill="rgba(255,255,255,0.04)"/>
  <circle cx="652" cy="56" r="8" fill="#f59e0b"/>
  <text x="672" y="60" fill="#94a3b8" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">STAGING</text>
  <text x="1040" y="60" fill="#64748b" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">4 tables</text>

  <!-- Table: users — MATCH -->
  <rect x="640" y="100" width="500" height="88" rx="10" fill="rgba(37,99,235,0.06)" stroke="rgba(37,99,235,0.15)" stroke-width="1"/>
  <text x="660" y="124" fill="#e2e8f0" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700">users</text>
  <rect x="710" y="112" width="60" height="18" rx="9" fill="rgba(37,99,235,0.15)"/>
  <text x="728" y="125" fill="#60a5fa" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="600">TABLE</text>
  <!-- Match indicator -->
  <rect x="1080" y="108" width="40" height="20" rx="10" fill="rgba(34,197,94,0.15)"/>
  <text x="1090" y="122" fill="#22c55e" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="700">OK</text>
  <text x="1040" y="124" fill="#94a3b8" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">12 columns</text>
  <g fill="#475569" font-family="monospace" font-size="10">
    <text x="660" y="150">id</text><text x="710" y="150">email</text><text x="770" y="150">name</text>
    <text x="840" y="150">role</text><text x="900" y="150">status</text><text x="970" y="150">created_at</text>
  </g>
  <text x="660" y="172" fill="#475569" font-family="monospace" font-size="10">+ 6 more columns</text>

  <!-- Table: orders — BREAKING CHANGE -->
  <rect x="640" y="200" width="500" height="100" rx="10" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.3)" stroke-width="1.5"/>
  <text x="660" y="224" fill="#fca5a5" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700">orders</text>
  <rect x="725" y="212" width="60" height="18" rx="9" fill="rgba(239,68,68,0.2)"/>
  <text x="743" y="225" fill="#fca5a5" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="600">TABLE</text>
  <!-- Breaking change indicator -->
  <rect x="1040" y="208" width="80" height="20" rx="10" fill="rgba(239,68,68,0.2)"/>
  <text x="1048" y="222" fill="#ef4444" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="700">BREAKING</text>
  <text x="1040" y="244" fill="#fca5a5" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">7 columns</text>
  <g fill="#fca5a5" font-family="monospace" font-size="10">
    <text x="660" y="250">id</text><text x="700" y="250">user_id</text><text x="780" y="250">total</text>
    <text x="840" y="250">created_at</text>
  </g>
  <!-- Removed column highlight -->
  <rect x="660" y="265" width="460" height="22" rx="4" fill="rgba(239,68,68,0.1)" stroke="rgba(239,68,68,0.2)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="675" y="280" fill="#ef4444" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="600">- status</text>
  <text x="730" y="280" fill="#f87171" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" font-style="italic">column removed</text>
  <text x="900" y="280" fill="#ef4444" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="600">- payment_method</text>
  <text x="1040" y="280" fill="#f87171" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" font-style="italic">column removed</text>

  <!-- Table: products — MATCH -->
  <rect x="640" y="312" width="500" height="88" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="660" y="336" fill="#e2e8f0" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700">products</text>
  <rect x="740" y="324" width="60" height="18" rx="9" fill="rgba(37,99,235,0.15)"/>
  <text x="758" y="337" fill="#60a5fa" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="600">TABLE</text>
  <rect x="1080" y="320" width="40" height="20" rx="10" fill="rgba(34,197,94,0.15)"/>
  <text x="1090" y="334" fill="#22c55e" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="700">OK</text>
  <text x="1040" y="336" fill="#94a3b8" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">15 columns</text>
  <g fill="#475569" font-family="monospace" font-size="10">
    <text x="660" y="362">id</text><text x="700" y="362">sku</text><text x="750" y="362">name</text>
    <text x="810" y="362">price</text><text x="870" y="362">category</text>
  </g>
  <text x="660" y="384" fill="#475569" font-family="monospace" font-size="10">+ 10 more columns</text>

  <!-- Table: inventory — NEW COLUMN -->
  <rect x="640" y="412" width="500" height="100" rx="10" fill="rgba(34,197,94,0.04)" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
  <text x="660" y="436" fill="#e2e8f0" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700">inventory</text>
  <rect x="755" y="424" width="60" height="18" rx="9" fill="rgba(37,99,235,0.15)"/>
  <text x="773" y="437" fill="#60a5fa" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="600">TABLE</text>
  <rect x="1040" y="420" width="80" height="20" rx="10" fill="rgba(34,197,94,0.15)"/>
  <text x="1048" y="434" fill="#22c55e" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="700">NON-BREAKING</text>
  <text x="1040" y="456" fill="#86efac" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">7 columns</text>
  <g fill="#475569" font-family="monospace" font-size="10">
    <text x="660" y="462">id</text><text x="700" y="462">product_id</text><text x="800" y="462">qty</text>
    <text x="850" y="462">location</text>
  </g>
  <!-- New column highlight -->
  <rect x="660" y="477" width="460" height="22" rx="4" fill="rgba(34,197,94,0.08)" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
  <text x="675" y="492" fill="#22c55e" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="600">+ warehouse_id</text>
  <text x="800" y="492" fill="#4ade80" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" font-style="italic">column added (UUID)</text>

  <!-- Summary bar -->
  <rect x="40" y="555" width="1120" height="46" rx="12" fill="url(#accent)"/>
  <text x="80" y="583" fill="#fff" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700">Schema Drift Detected</text>
  <circle cx="280" cy="578" r="5" fill="#fca5a5"/>
  <text x="294" y="583" fill="rgba(255,255,255,0.85)" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">1 breaking</text>
  <circle cx="410" cy="578" r="5" fill="#86efac"/>
  <text x="424" y="583" fill="rgba(255,255,255,0.85)" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">1 non-breaking</text>
  <circle cx="560" cy="578" r="5" fill="#93c5fd"/>
  <text x="574" y="583" fill="rgba(255,255,255,0.85)" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">2 unchanged</text>
  <text x="1020" y="583" fill="#fff" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="600">Review Changes &#8594;</text>
</svg>